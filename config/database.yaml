# Local Postgres (matches pgAdmin: LOCALHOST → postgres → Tradele schema)
# Secrets (password) should live in .env — leave password empty here.

database:
  host: localhost
  port: 5432
  name: postgres
  user: postgres
  password: ""          # set via DB_PASSWORD or DATABASE_URL in .env
  schema: Tradele
  auto_create_tables: false   # set true later when we add models/tables
